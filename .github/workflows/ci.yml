name: CI

# En cada push y pull request revisa que la app compile y que las pruebas pasen,
# así un cambio roto no llega a main sin que nadie se entere.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
