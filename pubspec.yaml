name: reels_manager
description: "App para guardar y organizar reels de Instagram: clientes, ejemplos y colaboraciones, con reproduccion del video desde el link."
publish_to: 'none'

version: 0.5.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Manejo de estado y arquitectura
  flutter_riverpod: ^3.3.2
  equatable: ^2.1.0

  # Reproduccion de reels embebidos (mismo paquete en Windows, Android e iOS)
  flutter_inappwebview: ^6.1.5

  # Backend
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

  # Login con Google en escritorio (flujo manual, ver
  # lib/features/auth/data/google_oauth_escritorio.dart)
  url_launcher: ^6.3.2
  http: ^1.6.0
  crypto: ^3.0.7

  # Calendario compartido
  table_calendar: ^3.2.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
