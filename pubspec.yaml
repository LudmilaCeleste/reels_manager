name: reels_manager
description: "App para guardar y organizar reels de Instagram: clientes, ejemplos y colaboraciones, con reproduccion del video desde el link."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Manejo de estado y arquitectura
  flutter_riverpod: ^3.4.2
  equatable: ^2.1.0

  # Reproduccion de reels embebidos (mismo paquete en Windows, Android e iOS)
  flutter_inappwebview: ^6.1.5

  # Backend. Las dependencias ya estan listas; la conexion real
  # (firebase_options.dart via flutterfire configure) se hace en el
  # siguiente paso, cuando creemos el proyecto de Firebase.
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
